name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  unit-tests:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Backend

      - name: Run unit tests
        run: npm run test:unit
        working-directory: Backend
        env:
          NODE_ENV: test
          RESEND_API_KEY: re_dummy_key_for_testing
          JWT_SECRET: ${{ secrets.JWT_SECRET }}      
    name: Integration Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Backend

      - name: Run integration tests
        run: npm run test:integrated
        working-directory: Backend
        env:
          NODE_ENV: test
          MONGODB_URL: mongodb://localhost:27017/notifyhub_ci   
          REDIS_URL: redis://localhost:6379
          RABBITMQ_URL: amqp://localhost:5672
          RESEND_API_KEY: re_dummy_key_for_testing
          JWT_SECRET: ${{ secrets.JWT_SECRET }}                 

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Backend

      - name: Check for vulnerabilities
        run: npm audit --audit-level=critical  
        working-directory: Backend

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ["unit-tests", "integration-tests", "audit"]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null -w "HTTP status: %{http_code}\n"

      - name: Confirm deployment triggered
        run: echo "Deploy hook triggered successfully. Render is now building."